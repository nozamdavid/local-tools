ServerName localhost
Listen 8080
PidFile /tmp/httpd.pid
ErrorLog /proc/self/fd/2

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule unixd_module modules/mod_unixd.so

DocumentRoot "/srv/loconvert/current"
TypesConfig conf/mime.types
AddType text/javascript .js .mjs
AddType application/wasm .wasm

<Directory "/">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/srv/loconvert">
    Options FollowSymLinks
</Directory>

<Directory "/srv/loconvert/current">
    Require all granted
</Directory>

<Directory "/srv/loconvert/shared/assets">
    Require all granted
</Directory>

RewriteEngine On

# Prefer retained hashes so older open tabs can still fetch their chunks.
RewriteCond "/srv/loconvert/shared$1" -f
RewriteRule "^(/assets/[^/]+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+)$" "/srv/loconvert/shared$1" [L]

RewriteCond "%{DOCUMENT_ROOT}$1" -f
RewriteRule "^(/.*)$" "-" [L]

# Keep missing files and asset directories out of the SPA fallback.
RewriteRule "^/(?:assets(?:/|$)|.*\.[^/]+/?$)" "-" [R=404,L]
RewriteRule "^/" "/index.html" [L]

Header set Cache-Control "no-cache"
<LocationMatch "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
